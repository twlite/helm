<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Dynamic rate panel</title></head>
  <body>
    <nav>Home Rates Deposit Transfer</nav>
    <main>
      <h1>Dynamic exchange rates</h1>
      <table id="rates">
        <thead><tr><th>Currency</th><th>Buying</th><th>Selling</th></tr></thead>
        <tbody><tr><td>CHF</td><td>170.10</td><td>171.00</td></tr></tbody>
      </table>
    </main>
    <script>
      setTimeout(() => {
        const body = document.querySelector('#rates tbody');
        if (body) body.insertAdjacentHTML('beforeend', `
          <tr><td>USD</td><td>132.10</td><td>132.70</td></tr>
          <tr><td>EUR</td><td>143.20</td><td>144.00</td></tr>
        `);
      }, 1_200);
    </script>
  </body>
</html>
